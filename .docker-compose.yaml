version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fm26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fm26-ingestion}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      PORT: ${PORT:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app:cached
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH}
