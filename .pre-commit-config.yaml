exclude: '(^|/)(__pycache__/|venv/|alembic/)'

repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
        args:
          - --line-length
          - "120"
          - --target-version
          - py312

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
        args:
          - --profile
          - black

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]