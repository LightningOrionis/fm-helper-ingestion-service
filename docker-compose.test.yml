version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5

  test-kafka:
    image: apache/kafka:4.3.0
    container_name: fm26-kafka
    logging:
      driver: "none"
    ports:
      - "9092:9092"
    env_file:
      - .env.test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: local
    depends_on:
      test-db:
        condition: service_healthy
      test-kafka:
        condition: service_healthy
    env_file:
      - .env.test
    environment:
      POSTGRES_URL: ${TEST_POSTGRES_URL}
    command: pytest tests/ -v
    volumes:
      - .:/app
