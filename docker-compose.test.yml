version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-testpassword}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-test_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-testuser} -d ${TEST_POSTGRES_DB:-test_db}"]
      interval: 2s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: local
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      POSTGRES_URL: ${TEST_POSTGRES_URL:-postgresql://testuser:testpassword@test-db:5432/test_db}
    command: pytest tests/ -v
    volumes:
      - .:/app
