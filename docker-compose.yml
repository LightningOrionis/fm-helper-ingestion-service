version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://app:apppassword@db:5432/app_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  db_data:
