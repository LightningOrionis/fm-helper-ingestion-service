version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fm26} -d ${POSTGRES_DB:-fm26-ingestion}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.0
    container_name: fm26-kafka
    ports:
      - "9092:9092"
    env_file:
      - .env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
        context: .
        dockerfile: Dockerfile
        args:
            ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
          condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app:cached
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH}

  kafka_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KAFKA_DATA_PATH}
